name: backup
on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: Verified rollout operation
        type: choice
        default: backup
        options:
          - backup
          - migrate
          - retire
permissions:
  contents: read
concurrency:
  group: db-backup
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Verify backup configuration
        env:
          MDJ_DB: ${{ secrets.MDJ_DB }}
          MDJ_DB_AUTH_TOKEN: ${{ secrets.MDJ_DB_AUTH_TOKEN }}
          BACKUP_CERT: ${{ secrets.MDJ_BACKUP_RECIPIENT_CERT }}
        run: |
          test -n "$MDJ_DB" && test -n "$MDJ_DB_AUTH_TOKEN" && test -n "$BACKUP_CERT" || { echo '::error::Configure database credentials and MDJ_BACKUP_RECIPIENT_CERT before backing up'; exit 1; }
      - run: pnpm install --frozen-lockfile
      - name: Export consistent database snapshot
        env:
          MDJ_DB: ${{ secrets.MDJ_DB }}
          MDJ_DB_AUTH_TOKEN: ${{ secrets.MDJ_DB_AUTH_TOKEN }}
        run: node tools/export-backup.mjs backups
      - name: Export and verify private attachments
        env:
          MDJ_PRIVATE_STORAGE: ${{ vars.MDJ_PRIVATE_STORAGE }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PRIVATE_BUCKET: ${{ secrets.R2_PRIVATE_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: node --require tsx/cjs tools/export-media-backup.cjs backups
      - name: Verify isolated database and attachment restore
        env:
          MDJ_RESTORE_DB: file:/tmp/mandiju-restore.db
        run: |
          set -euo pipefail
          snapshot="$(find backups -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          node tools/restore-backup.mjs "$snapshot"
          MDJ_DB=file:/tmp/mandiju-restore.db MDJ_PRIVATE_STORAGE=/tmp/mandiju-restore-media node --require tsx/cjs tools/restore-media-backup.cjs "$snapshot"
      - name: Apply verified additive migration
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation != 'backup' }}
        env:
          MDJ_DB: ${{ secrets.MDJ_DB }}
          MDJ_DB_AUTH_TOKEN: ${{ secrets.MDJ_DB_AUTH_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PRIVATE_BUCKET: ${{ secrets.R2_PRIVATE_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          node --require tsx/cjs tools/migrate-private-media.cjs --apply --backup-verified
          if [ "$OPERATION" = retire ]; then
            node --require tsx/cjs tools/migrate-private-media.cjs --apply --backup-verified --retire-public
          fi
      - name: Encrypt before upload
        env:
          BACKUP_CERT: ${{ secrets.MDJ_BACKUP_RECIPIENT_CERT }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$BACKUP_CERT" > "$RUNNER_TEMP/backup-recipient.pem"
          tar -czf "$RUNNER_TEMP/snapshot.tar.gz" backups
          openssl cms -encrypt -binary -aes-256-cbc -in "$RUNNER_TEMP/snapshot.tar.gz" -out backup.p7m -outform DER "$RUNNER_TEMP/backup-recipient.pem"
          sha256sum backup.p7m > backup.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-db-backup-${{ github.run_number }}
          path: |
            backup.p7m
            backup.sha256
          retention-days: 30
          if-no-files-found: error
      - name: Remove plaintext working copies
        if: always()
        run: rm -rf backups "$RUNNER_TEMP/snapshot.tar.gz" "$RUNNER_TEMP/backup-recipient.pem"
