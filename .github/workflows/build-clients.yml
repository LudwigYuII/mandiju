name: build-clients

# 慢递局客户端构建
# - push 到 main：构建 Android APK 并提交回 public/downloads/mandiju.apk（[skip ci]）
# - push 标签 v*：构建 APK + Windows 安装包并发布 GitHub Release
#
# 注意：这里刻意不加 `paths:` 过滤。GitHub Actions 的 paths 过滤对 tag push 同样生效，
# 一旦启用，打 v* 标签的推送会被 paths 过滤掉 → Release 永远不触发（v1.7.1 就栽在这）。

on:
  push:
    branches:
      - main
    tags:
      - v*

permissions:
  contents: write

concurrency:
  group: build-clients-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install web deps
        run: pnpm install --no-frozen-lockfile

      - name: Add Capacitor deps (idempotent)
        run: pnpm add -D @capacitor/cli @capacitor/core @capacitor/android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Capacitor 8 的 capacitor-android 库以 Java 21 编译（source/targetCompatibility = VERSION_21），必须 21
          java-version: '21'

      # 不要再使用 android-actions/setup-android@v3：它内部执行 `sdkmanager tools`，
      # 而新版 cmdline-tools（16.0+）已移除 "tools" 包，会直接 `Failed to find package 'tools'` 失败。
      # ubuntu-latest 镜像自带 SDK，手动接受许可 + 安装所需包即可。
      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then echo "Android SDK not found at $SDK"; exit 1; fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            CMDLINE="$SDK/cmdline-tools/latest/bin"
          else
            CMDLINE="$(dirname "$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -n1)")"
          fi
          echo "cmdline-tools: $CMDLINE"
          echo "$CMDLINE" >> "$GITHUB_PATH"
          SDKMANAGER="$CMDLINE/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          # AGP 8.13 默认使用 build-tools 35.0.0（本地构建已验证），必须显式安装
          "$SDKMANAGER" --sdk_root="$SDK" --install "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" "platforms;android-34" "build-tools;34.0.0" | tail -n 5

      - name: Generate android project
        run: |
          mkdir -p out
          # android 平台目录不入库（.gitignore），每次全新生成。
          # 注意：`cap add` 没有 --no-sync 选项（曾导致 CI "unknown option" 失败），
          # 它会自动执行一次 sync，这里再显式 sync 一次保证插件配置最新。
          if [ ! -d android/app/src/main ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Apply branding (icons / splash / colors)
        run: |
          RES=android/app/src/main/res
          LOGO=public/assets/logo/A0.png
          # ubuntu 镜像通常自带 ImageMagick 6 的 convert，缺失则补装
          command -v convert >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick; }

          # colors.xml：模板 styles.xml 引用了 @color/colorPrimary，需补齐；另定义 splash 底色
          cat > "$RES/values/colors.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#c03a2b</color>
              <color name="colorPrimaryDark">#a03224</color>
              <color name="colorAccent">#d6452f</color>
              <color name="splash_background">#f3ecde</color>
          </resources>
          EOF

          # 自适应图标背景 → 米纸色
          sed -i 's/#FFFFFF/#F3ECDE/' "$RES/values/ic_launcher_background.xml"

          # 启动主题：splash 背景色 + 图标（Android 12+）
          python3 - <<'PY'
          import io
          p = "android/app/src/main/res/values/styles.xml"
          s = io.open(p, encoding="utf-8").read()
          old = '<item name="android:background">@drawable/splash</item>'
          new = old + '''
                  <item name="windowSplashScreenBackground">@color/splash_background</item>
                  <item name="windowSplashScreenAnimatedIcon">@drawable/splash</item>'''
          assert old in s, "styles.xml pattern not found"
          io.open(p, "w", encoding="utf-8").write(s.replace(old, new, 1))
          PY

          # 传统启动图标（米纸底铺满 logo）+ 自适应前景（透明底 108dp 铺满）
          for d in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            den="${d%%:*}"; s="${d##*:}"
            convert "$LOGO" -resize "${s}x${s}" "$RES/mipmap-$den/ic_launcher.png"
            cp "$RES/mipmap-$den/ic_launcher.png" "$RES/mipmap-$den/ic_launcher_round.png"
          done
          for d in "mdpi:108" "hdpi:162" "xhdpi:216" "xxhdpi:324" "xxxhdpi:432"; do
            den="${d%%:*}"; s="${d##*:}"
            convert "$LOGO" -resize "${s}x${s}" "$RES/mipmap-$den/ic_launcher_foreground.png"
          done

          # splash：2732x2732 米纸底 + logo 居中 1024
          convert -size 2732x2732 xc:"#f3ecde" \( "$LOGO" -resize 1024x1024 \) -gravity center -composite "$RES/drawable/splash.png"

          # 删除未被引用的横竖屏 splash 变体，减小 APK 体积
          rm -rf "$RES"/drawable-land-* "$RES"/drawable-port-*

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename and stage APK
        run: |
          mkdir -p public/downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk mandiju.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk public/downloads/mandiju.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mandiju-apk
          path: mandiju.apk
          if-no-files-found: error

      - name: Commit APK back to repo (main branch only)
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main || echo "pull failed, continuing"
          git add -f public/downloads/mandiju.apk
          if git diff --cached --quiet; then
            echo "APK unchanged, skip commit"
          else
            git commit -m "build: 更新 Android APK (mandiju.apk) [skip ci]"
            git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:main
          fi

  win:
    name: Windows Desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create desktop shell project
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop | Out-Null
          Copy-Item public/assets/logo/A0.png desktop/icon.png
          @'
          {
            "name": "mandiju-desktop",
            "version": "0.1.0",
            "private": true,
            "description": "慢递局 Windows 桌面壳",
            "main": "main.js",
            "scripts": {
              "start": "electron .",
              "dist": "electron-builder --win"
            },
            "devDependencies": {
              "electron": "^31.7.7",
              "electron-builder": "^25.1.8"
            },
            "pnpm": {
              "onlyBuiltDependencies": ["electron", "esbuild"]
            },
            "build": {
              "appId": "uno.ludwig.mandiju",
              "productName": "慢递局",
              "directories": { "output": "dist" },
              "files": ["main.js", "package.json", "icon.png"],
              "win": { "icon": "icon.png", "target": ["nsis", "portable"] },
              "nsis": {
                "oneClick": false,
                "allowToChangeInstallationDirectory": true,
                "createDesktopShortcut": true,
                "createStartMenuShortcut": true,
                "shortcutName": "慢递局",
                "artifactName": "mandiju-setup.${ext}"
              },
              "portable": {
                "artifactName": "mandiju-portable.${ext}"
              }
            }
          }
          '@ | Set-Content -Encoding UTF8 desktop/package.json
          @'
          onlyBuiltDependencies:
            - electron
            - esbuild
          '@ | Set-Content -Encoding UTF8 desktop/pnpm-workspace.yaml
          @'
          const { app, BrowserWindow, Menu, shell } = require('electron');
          const path = require('path');
          const SITE_URL = 'https://ludwig.uno';
          function isSameSite(url) {
            try {
              const host = new URL(url).host;
              return host === 'ludwig.uno' || host.endsWith('.ludwig.uno');
            } catch { return false; }
          }
          function createWindow() {
            const win = new BrowserWindow({
              width: 800,
              height: 1000,
              title: '慢递局',
              icon: path.join(__dirname, 'icon.png'),
              autoHideMenuBar: true,
              backgroundColor: '#f3ecde',
              webPreferences: { contextIsolation: true, nodeIntegration: false, sandbox: true },
            });
            win.loadURL(SITE_URL);
            win.webContents.setWindowOpenHandler(({ url }) => {
              shell.openExternal(url);
              return { action: 'deny' };
            });
            win.webContents.on('will-navigate', (event, url) => {
              if (!isSameSite(url)) {
                event.preventDefault();
                shell.openExternal(url);
              }
            });
          }
          app.whenReady().then(() => {
            Menu.setApplicationMenu(null);
            createWindow();
            app.on('activate', () => {
              if (BrowserWindow.getAllWindows().length === 0) createWindow();
            });
          });
          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit();
          });
          '@ | Set-Content -Encoding UTF8 desktop/main.js

      - name: Install desktop deps
        working-directory: desktop
        run: pnpm install --no-frozen-lockfile

      - name: Build NSIS + portable
        working-directory: desktop
        run: pnpm exec electron-builder --win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mandiju-windows
          path: |
            desktop/dist/mandiju-setup-*.exe
            desktop/dist/mandiju-portable-*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [apk, win]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            慢递局客户端安装包（与 https://ludwig.uno 同源，壳内加载线上站点，站点更新即最新）。

            - **Android**：`mandiju.apk`（debug 签名，若手机上装过别的机器构建的同名包，请先卸载再安装）
            - **Windows 安装版**：`mandiju-setup-*.exe`（可选安装目录、创建桌面与开始菜单快捷方式）
            - **Windows 免安装版**：`mandiju-portable-*.exe`

            也可以不装客户端：手机直接用浏览器「添加到主屏幕」，Windows 用 Chrome/Edge 安装为桌面应用（PWA）。
          files: |
            artifacts/mandiju-apk/mandiju.apk
            artifacts/mandiju-windows/*.exe
